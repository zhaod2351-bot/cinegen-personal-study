<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineGen AI 导演台（个人学习版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e5e5e5;
      }
      /* Sony Style Scrollbar - Thin, Rectangular */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Utilities */
      .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Personal study themes. The light themes override the original
         industrial dark palette without changing project data or AI logic. */
      html[data-theme='paper'] body {
        background: #f5f1e9;
        color: #29231f;
      }
      html[data-theme='paper'] .bg-black,
      html[data-theme='paper'] .bg-\[\#050505\],
      html[data-theme='paper'] .bg-\[\#080808\],
      html[data-theme='paper'] .bg-\[\#0A0A0A\],
      html[data-theme='paper'] .bg-\[\#0F0F0F\],
      html[data-theme='paper'] .bg-\[\#111\],
      html[data-theme='paper'] .bg-\[\#121212\],
      html[data-theme='paper'] .bg-\[\#141414\],
      html[data-theme='paper'] .bg-\[\#151515\],
      html[data-theme='paper'] .bg-\[\#1A1A1A\] { background-color: #fffdf8 !important; }
      html[data-theme='paper'] .bg-zinc-800,
      html[data-theme='paper'] .bg-zinc-900,
      html[data-theme='paper'] .bg-zinc-950 { background-color: #f2ece2 !important; }
      html[data-theme='paper'] .border-zinc-800,
      html[data-theme='paper'] .border-zinc-900 { border-color: #ded3c4 !important; }
      html[data-theme='paper'] .text-white,
      html[data-theme='paper'] .text-gray-100 { color: #29231f !important; }
      html[data-theme='paper'] .text-zinc-100,
      html[data-theme='paper'] .text-zinc-200,
      html[data-theme='paper'] .text-zinc-300,
      html[data-theme='paper'] .text-zinc-400,
      html[data-theme='paper'] .text-zinc-500 { color: #70645a !important; }
      html[data-theme='paper'] .glass-panel { background: rgba(255, 253, 248, .88); border-color: #ded3c4; }

      html[data-theme='mist'] body { background: #edf1f5; color: #1f2933; }
      html[data-theme='mist'] .bg-black,
      html[data-theme='mist'] .bg-\[\#050505\],
      html[data-theme='mist'] .bg-\[\#080808\],
      html[data-theme='mist'] .bg-\[\#0A0A0A\],
      html[data-theme='mist'] .bg-\[\#0F0F0F\],
      html[data-theme='mist'] .bg-\[\#111\],
      html[data-theme='mist'] .bg-\[\#121212\],
      html[data-theme='mist'] .bg-\[\#141414\],
      html[data-theme='mist'] .bg-\[\#151515\],
      html[data-theme='mist'] .bg-\[\#1A1A1A\] { background-color: #f8fafc !important; }
      html[data-theme='mist'] .bg-zinc-800,
      html[data-theme='mist'] .bg-zinc-900,
      html[data-theme='mist'] .bg-zinc-950 { background-color: #e6edf3 !important; }
      html[data-theme='mist'] .border-zinc-800,
      html[data-theme='mist'] .border-zinc-900 { border-color: #cbd5df !important; }
      html[data-theme='mist'] .text-white,
      html[data-theme='mist'] .text-gray-100 { color: #1f2933 !important; }
      html[data-theme='mist'] .text-zinc-100,
      html[data-theme='mist'] .text-zinc-200,
      html[data-theme='mist'] .text-zinc-300,
      html[data-theme='mist'] .text-zinc-400,
      html[data-theme='mist'] .text-zinc-500 { color: #637381 !important; }
      html[data-theme='mist'] .glass-panel { background: rgba(248, 250, 252, .88); border-color: #cbd5df; }

      /* Asset studio: desktop proportions deliberately match the reference
         workflow: 320px global navigation, 445px asset library, flexible detail. */
      .asset-studio { height:100%; min-height:0; display:grid; grid-template-rows:96px minmax(0,1fr); background:#fffaf3; color:#302821; }
      .asset-category-bar { display:flex; align-items:center; justify-content:space-between; padding:0 30px; border-bottom:1px solid #e4dbcf; background:#fffdf8; }
      .asset-kind-tabs { display:flex; align-items:center; height:58px; padding:4px; border:1px solid #e4dbcf; border-radius:7px; background:#f8f1e5; }
      .asset-kind-tabs button { height:48px; display:flex; gap:10px; align-items:center; padding:0 24px; border:0; color:#635a51; background:transparent; border-radius:6px; font-size:17px; cursor:pointer; }
      .asset-kind-tabs button.active { color:#312920; background:#fffdf8; box-shadow:0 0 0 1px #ded3c4 inset; }
      .asset-kind-tabs button:disabled { cursor:not-allowed; opacity:.65; }
      .asset-style { padding-left:18px; border-left:1px solid #e4dbcf; color:#9a8d80; font-size:14px; }.asset-style b{color:#392f28;margin-left:8px}
      .asset-workbench { min-height:0; display:grid; grid-template-columns:445px minmax(0,1fr); }
      .asset-library { min-height:0; overflow:hidden; display:flex; flex-direction:column; border-right:1px solid #e4dbcf; background:#fffdf8; }
      .asset-search-row { display:flex; gap:10px; padding:20px 20px 14px; }.asset-search-row label { flex:1; height:47px; display:flex; align-items:center; gap:11px; padding:0 14px; background:#f8f1e5; border-radius:7px; color:#74685d; }.asset-search-row input{width:100%;border:0;outline:0;background:transparent;color:#302821;font-size:16px}.asset-search-row input::placeholder{color:#95887c}.asset-add{width:47px;border:0;border-radius:6px;background:#c9570c;color:white;display:grid;place-items:center;cursor:pointer}
      .asset-library-tools{display:flex;align-items:center;justify-content:space-between;padding:0 20px 16px;border-bottom:1px solid #eee5db}.asset-library-tools>div{display:flex;gap:5px}.asset-library-tools button{height:33px;border:1px solid transparent;border-radius:5px;background:#faf5ec;color:#62584f;padding:0 11px;display:grid;place-items:center;font-size:13px;cursor:pointer}.asset-library-tools button.selected{background:#fffdf8;border-color:#e4dbcf;color:#302821}
      .asset-list{overflow:auto;padding:14px 15px 28px;display:flex;flex-direction:column;gap:8px}.asset-list.grid{display:grid;grid-template-columns:1fr 1fr;align-content:start}.asset-item{min-height:74px;width:100%;display:flex;align-items:center;gap:13px;padding:10px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;color:#302821;cursor:pointer}.asset-item:hover{background:#fcf6ed}.asset-item.active{border-color:#e3d6c8;background:#fffaf2;box-shadow:0 2px 4px rgba(59,42,27,.04)}.asset-item.active:before{content:'';width:3px;align-self:stretch;background:#c9570c;border-radius:2px;margin-left:-10px}.asset-thumb{width:49px;height:49px;flex:0 0 49px;border-radius:4px;background:#f2ece2;display:grid;place-items:center;overflow:hidden;color:#8b7e71}.asset-thumb img{width:100%;height:100%;object-fit:cover}.asset-name{display:flex;min-width:0;flex:1;flex-direction:column;gap:5px}.asset-name b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-name small{font-size:12px;color:#998d82}.asset-item i{width:8px;height:8px;border-radius:999px;background:#2684ff;flex:0 0 auto}
      .asset-detail{min-width:0;overflow:auto;background:#fffaf3;padding:38px 64px 50px}.asset-detail-header{display:flex;justify-content:space-between;gap:30px;margin-bottom:42px}.asset-title{display:flex;gap:15px;align-items:flex-start}.asset-title>span{width:52px;height:52px;display:grid;place-items:center;border-radius:999px;background:#e8f1ff;color:#1768ff}.asset-title-line{display:flex;align-items:center;gap:15px}.asset-title h1{margin:0;font-size:43px;line-height:52px;letter-spacing:-2px;color:#241c17}.asset-title em{padding:3px 12px;border:1px solid #b8f0c9;border-radius:4px;background:#e8fff0;color:#168643;font-size:14px;font-style:normal}.asset-title p{display:flex;flex-wrap:wrap;gap:10px;margin:9px 0 0;color:#978a7e;font-size:15px}.asset-title p b{padding:2px 10px;border-radius:4px;background:#fcf0dc;color:#594429;font-weight:500}.asset-title p span{margin-left:22px}.asset-title strong{padding:2px 10px;border:1px solid #b8f0c9;border-radius:4px;background:#effff3;color:#168643;font-weight:500}.asset-title code{color:#b7aca1}.asset-actions{display:flex;gap:10px;align-items:flex-start}.asset-actions button{height:46px;display:flex;align-items:center;gap:10px;padding:0 21px;border:1px solid #ded3c4;border-radius:5px;background:#fffdf8;color:#352b23;font-size:16px;cursor:pointer}.asset-actions .primary{background:#c9570c;border-color:#c9570c;color:white}.asset-actions .icon{padding:0 9px;border-color:transparent;background:transparent}
      .asset-detail-body{display:grid;grid-template-columns:300px minmax(440px,1fr);gap:58px;align-items:start}.asset-image-box{position:relative;height:212px;border:1px solid #e7ded3;border-radius:10px;overflow:hidden;background:#fffdf8;display:grid;place-items:center;color:#a09386}.asset-image-box img{width:100%;height:100%;object-fit:cover}.asset-image-box button{position:absolute;inset:0;display:flex;gap:8px;align-items:center;justify-content:center;border:0;background:rgba(48,40,33,.56);color:white;font-size:15px;opacity:0;transition:opacity .15s;cursor:pointer}.asset-image-box:hover button{opacity:1}.asset-image-box input{display:none}.asset-reference h3{display:flex;align-items:center;gap:8px;margin:26px 0 13px;font-size:15px;color:#463a30}.visual-copy,.asset-reference textarea{box-sizing:border-box;width:100%;min-height:112px;padding:17px 18px;border:1px solid #e8ded1;border-radius:6px;background:#fbf4e8;color:#57483b;font-size:16px;line-height:1.6}.asset-reference textarea,.asset-note textarea{outline-color:#c9570c;resize:vertical}.asset-reference>p{margin:14px 0 0;color:#998d82;font-size:13px;line-height:1.45}.asset-info-tabs{height:49px;padding:5px;display:grid;grid-template-columns:1fr 1fr;background:#fbf2e2;border-radius:5px}.asset-info-tabs button{border:0;background:transparent;border-radius:4px;color:#65574c;font-size:15px;cursor:pointer}.asset-info-tabs button.active{background:#fffdf8;box-shadow:0 1px 4px rgba(76,57,38,.1);color:#312820}.asset-info-tabs b{display:inline-block;margin-left:14px;color:#ad4709;font-weight:500}.asset-note{padding:38px 0 30px}.asset-note h2{margin:0 0 22px;font-size:19px;color:#30251d}.asset-note h2:before{content:'▦';color:#c9570c;margin-right:10px}.asset-note p{margin:0;color:#5f4f42;font-size:17px;line-height:1.7}.asset-note textarea{width:100%;min-height:110px;padding:14px;border:1px solid #e4d7c8;border-radius:6px;background:#fffdf8;color:#4e4035;font-size:16px}.asset-divider{height:1px;background:#e1d6c8}.asset-metadata{display:grid;grid-template-columns:1fr 1fr;gap:55px;padding-top:30px}.asset-metadata h3{margin:0 0 18px;font-size:15px;color:#4c3c2f}.asset-metadata p{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start;margin:0 0 15px;font-size:16px}.asset-metadata label{color:#795f4b}.asset-metadata p>span{color:#352a21}.asset-metadata .tag-row span{display:flex;flex-wrap:wrap;gap:7px}.asset-metadata i,.asset-metadata .preset{display:inline-block;padding:4px 9px;border-radius:4px;background:#f5ead7;color:#705940;font-size:13px;font-style:normal}.linked-shots{padding-top:23px;display:flex;flex-direction:column;gap:10px}.linked-shots button{display:grid;grid-template-columns:90px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:16px;border:1px solid #e5dacd;border-radius:6px;background:#fffdf8;text-align:left;color:#3c2e23;cursor:pointer}.linked-shots button:hover{border-color:#c9570c}.linked-shots span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.linked-shots small{color:#9a8c80}
      @media(max-width:1100px){.asset-workbench{grid-template-columns:360px minmax(0,1fr)}.asset-detail{padding:32px}.asset-detail-body{grid-template-columns:240px minmax(380px,1fr);gap:32px}.asset-title h1{font-size:34px}.asset-actions .primary{display:none}}

      /* Director workspace follows the same editorial grid as the reference: context rail, continuous shot rows and prompt rail. */
      .director-studio{height:100%;min-height:0;display:flex;flex-direction:column;background:#fffaf3;color:#302821}.director-topbar{height:105px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #e4dbcf;background:#fffdf8}.director-topbar h1{margin:0;font-size:27px}.director-topbar p{margin:8px 0 0;color:#907f70;font-size:14px}.director-generate{display:flex;gap:9px;align-items:center;height:43px;padding:0 17px;border:1px solid #ded3c4;border-radius:6px;background:#fffdf8;color:#45362b;font-size:15px;cursor:pointer}.director-body{display:grid;grid-template-columns:304px minmax(0,1fr);flex:1;min-height:0}.director-context{overflow:auto;background:#fffdf8;border-right:1px solid #e4dbcf}.director-context section{padding:26px 26px 25px;border-bottom:1px solid #e4dbcf}.director-context h2{display:flex;align-items:center;gap:8px;margin:0 0 20px;font-size:14px}.director-context section>p{margin:0;color:#76675b;font-size:14px;line-height:1.65;font-style:italic}.context-row{display:flex;justify-content:space-between;padding:10px 0;color:#4d3d31;font-size:15px}.context-row small{color:#a09184}.director-sequence{overflow:auto}.scene-banner{height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#201f1d;color:#fff}.scene-banner b{color:#77716a;font:700 32px 'JetBrains Mono',monospace}.scene-banner strong{font-size:22px}.scene-banner span{margin-left:auto;color:#aaa299;font-size:13px}.director-shot{min-height:184px;display:grid;grid-template-columns:210px minmax(420px,1fr) 300px;border-bottom:1px solid #ded3c4;background:#fffdf8}.shot-side{padding:35px 38px;color:#644d3b}.shot-side b{display:block;font-size:14px;font-weight:500}.shot-side span,.shot-side small{display:block;margin-top:16px;padding:7px 10px;border:1px solid #dfd3c4;border-radius:4px;background:#f7efe4;text-align:center;color:#6d5c4f;font-size:12px}.shot-side small{margin-top:8px;line-height:1.4}.shot-main{padding:30px 25px;border-right:1px solid #e4dbcf}.shot-content-head{display:flex;align-items:center;justify-content:space-between}.shot-content-head p{margin:0;color:#887666;font-size:14px}.shot-content-head button{display:flex;gap:6px;align-items:center;border:0;background:transparent;color:#a64a0e;font-size:13px;cursor:pointer}.shot-action{margin:10px 0;color:#514033;font-size:17px;line-height:1.75}.shot-main textarea{box-sizing:border-box;width:100%;min-height:84px;padding:10px;border:1px solid #d8c9b8;border-radius:5px;background:#fffdf8;color:#4e3d30;font:16px/1.6 Inter,sans-serif;resize:vertical;outline-color:#c9570c}.shot-main blockquote{margin:13px 0;padding-left:15px;border-left:2px solid #e2d3c2;color:#755c49;font-size:15px;line-height:1.5}.shot-main blockquote textarea{min-height:50px}.shot-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.shot-tags i{padding:4px 10px;border-radius:999px;background:#f5eddf;color:#75604b;font-size:12px;font-style:normal}.shot-prompt{padding:30px}.shot-prompt h3{margin:0 0 12px;color:#5c493b;font-size:14px}.shot-prompt h3:before{content:'◎';margin-right:8px}.shot-prompt textarea{box-sizing:border-box;width:100%;min-height:55px;border:0;border-radius:4px;background:#e1ded9;color:#61564b;padding:9px;font:12px/1.4 Inter,sans-serif;resize:vertical;outline:none}.shot-frame{height:66px;margin-top:13px;display:grid;place-items:center;border:1px dashed #d6cbbb;border-radius:5px;color:#b5a999;overflow:hidden}.shot-frame img{width:100%;height:100%;object-fit:cover}@media(max-width:1200px){.director-shot{grid-template-columns:170px minmax(340px,1fr) 240px}.shot-side{padding:28px 20px}.shot-prompt{padding:25px 18px}}
    </style>
